name: Validate
on: push
jobs: 
  validate-file:
    runs-on: ubuntu-latest

    steps:
    - name: get repo code
      uses: actions/checkout@v4

    - name: validate html file
      run: test -f public/index.html

    - name: validate js file
      run : test -f src/index.js

    - name: validate js code
      run: node --check src/index.js


